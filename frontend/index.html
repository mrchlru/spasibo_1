<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />

    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Ярлык на главный экран, статус-бар PWA, цвет браузера -->
    <meta name="theme-color" content="#5CA14A" />
    <meta name="application-name" content="Спасибо" />
    <meta name="apple-mobile-web-app-title" content="Спасибо" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Порядок важен: вкладка на ПК (Chrome / Edge / Firefox / Яндекс) часто берёт
      первый подходящий rel=icon. AVIF первым ломает отображение у части десктопных
      сборок — они не подставляют следующий вариант. Сначала ICO и PNG, AVIF в конце.
    -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/avif" href="/favicon.avif" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Спасибо</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Неблокирующая загрузка шрифта (media=print + onload swap). Если
      fonts.googleapis.com медленный, рендер не ждёт его — на странице
      сразу применяется системный fallback, а Inter подменяется когда
      загрузится.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
    </noscript>

    <link rel="preload" as="image" href="/assets/slider/mug-knob.avif">
    <link rel="preconnect" href="https://s3.twcstorage.ru" crossorigin>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('spasibo_app_settings_snapshot');
          if (!raw) return;
          var snap = JSON.parse(raw);
          if (!snap || !snap.theme_assets) return;
          var season = snap.season_theme === 'winter' ? 'winter' : 'summer';
          var assets = snap.theme_assets[season] || {};
          ['header_image_mobile', 'thanks_button', 'section_slider_knob'].forEach(function (key) {
            var url = assets[key];
            if (!url || url.indexOf('http') !== 0) return;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = url;
            document.head.appendChild(link);
          });
        } catch (e) { /* ignore */ }
      })();
    </script>

    <style>
      /* Минимальный inline-лоадер, чтобы пользователь видел индикатор пока
         JS-бандл и API-данные ещё едут — белый экран на 30+ секунд (особенно
         при холодном старте бэкенда) воспринимается как «приложение зависло». */
      html, body { margin: 0; padding: 0; background: #f7f7f8; }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f8;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #initial-loader[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: #5CA14A;
        border-radius: 50%;
        animation: il-spin 0.9s linear infinite;
      }
      @keyframes il-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" aria-label="Загрузка"><div class="spinner"></div></div>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var isAndroidApk = /SpasiboAndroid\/\d/i.test(ua);
        var isApple = /iPhone|iPod|iPad/i.test(ua)
          || (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
        var isIosSafariTab = isApple && !window.navigator.standalone;
        if (!isAndroidApk && !isIosSafariTab) {
          return;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.filter(function (key) { return key.indexOf('spasibo-') === 0; })
              .forEach(function (key) { caches.delete(key); });
          }).catch(function () {});
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Telegram SDK — только для Mini App; async после React, чтобы не ломать WebView -->
    <script async src="%VITE_API_URL%/telegram/webapp-sdk"></script>
  </body>
</html>
